<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وِردي – مراجعة الحفظ اليومية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri&display=swap">
<style>
:root{--bg:#f6f3ea;--card:#fff;--ink:#1f2a24;--mute:#6b766f;--acc:#1f7a5a;--acc2:#e3f2ec;--warn:#b7791f;--bad:#c0392b;--line:#e2ddcf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b2420;--ink:#e8efe9;--mute:#97a39b;--acc:#4cc59a;--acc2:#1f3a30;--warn:#e0b04f;--bad:#e5786b;--line:#2b3731;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b2420;--ink:#e8efe9;--mute:#97a39b;--acc:#4cc59a;--acc2:#1f3a30;--warn:#e0b04f;--bad:#e5786b;--line:#2b3731;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;line-height:1.7;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}h2{font-size:1.1rem;margin:0 0 8px}
.sub{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--acc2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem;color:var(--acc)}.stat span{font-size:.78rem;color:var(--mute)}
.rng{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}
.rng a{color:var(--acc);text-decoration:none;font-size:.85rem;white-space:nowrap}
.rng b{font-size:1.02rem}
button{font-family:inherit;font-size:1rem;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button.sm{padding:6px 12px;font-size:.85rem}
button:disabled{opacity:.5}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rate button.g{background:var(--acc)}.rate button.m{background:var(--warn)}.rate button.w{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:300px;overflow-y:auto;padding:4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:.85rem;font-weight:400}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select{font-family:inherit;font-size:1rem;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.bar{height:10px;border-radius:99px;background:var(--acc2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{aspect-ratio:1;border-radius:8px;background:var(--acc2);font-size:.7rem;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.day.g{background:var(--acc);color:#fff}.day.m{background:var(--warn);color:#fff}.day.w{background:var(--bad);color:#fff}
.day.t{outline:2px solid var(--ink)}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:transparent;color:var(--mute);border-radius:0;padding:12px 2px;font-size:.78rem}
nav button.on{color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
.ok{text-align:center;padding:10px;color:var(--acc);font-weight:700}
.hide{display:none}
.ay{font-family:Amiri,"Traditional Arabic",serif;font-size:var(--fz,1.3rem);line-height:2.1}.mk{cursor:pointer;color:var(--warn);font-size:1.1rem;padding:0 4px}.hid{filter:blur(7px);cursor:pointer}.hid.show{filter:none}
</style>
</head>
<body>
<main id="app"></main>
<nav><button data-t="today" class="on">اليوم</button><button data-t="mem">محفوظاتي</button><button data-t="exam">اختبار</button><button data-t="read">المصحف</button><button data-t="prog">تقدّمي</button></nav>
<script>
var N=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
var C=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
var KEY="wird_v1";
function fresh(){return{mem:[],juz:[],parts:[],nlog:[],per:20,order:"asc",ptr:0,hist:{},weak:[],tab:"today",cyc:0,quiz:{ok:0,n:0}}}
var S=fresh();
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ar(n){return Number(n).toLocaleString("ar-EG")}
function dk(d){d=d||new Date();return d.toLocaleDateString("en-CA")}
var ALL=[];for(var si=1;si<=114;si++)for(var ai=1;ai<=C[si-1];ai++)ALL.push(si*1000+ai);
var JS=[[1,1],[2,142],[2,253],[3,93],[4,24],[4,148],[5,82],[6,111],[7,88],[8,41],[9,93],[11,6],[12,53],[15,1],[17,1],[18,75],[21,1],[23,1],[25,21],[27,56],[29,46],[33,31],[36,28],[39,32],[41,47],[46,1],[51,31],[58,1],[67,1],[78,1]].map(function(x){return ALL.indexOf(x[0]*1000+x[1])});
JS.push(ALL.length);
function opts(){return N.map(function(n,i){return '<option value="'+(i+1)+'">'+n+'</option>'}).join("")}
function flat(){
  var set={};
  S.mem.forEach(function(s){for(var a=1;a<=C[s-1];a++)set[s*1000+a]=1});
  S.juz.forEach(function(j){ALL.slice(JS[j-1],JS[j]).forEach(function(v){set[v]=1})});
  S.parts.forEach(function(p){for(var a=p.from;a<=p.to;a++)set[p.s*1000+a]=1});
  return Object.keys(set).map(Number).sort(function(x,y){
    var sx=Math.floor(x/1000),sy=Math.floor(y/1000);
    if(sx!==sy)return S.order==="desc"?sy-sx:sx-sy;
    return x-y});
}
function ranges(f){
  var out=[],cur=null;
  f.forEach(function(v){var s=Math.floor(v/1000),a=v%1000;
    if(cur&&cur.s===s&&a===cur.to+1)cur.to=a;else{cur={s:s,from:a,to:a};out.push(cur)}});
  return out;
}
function portion(){
  var f=flat();if(!f.length)return[];
  var n=Math.min(S.per,f.length),p=S.ptr%f.length,sl=[];
  for(var i=0;i<n;i++)sl.push(f[(p+i)%f.length]);
  return ranges(sl);
}
function cnt(r){return r.to-r.from+1}
function rtxt(r){return "سورة "+N[r.s-1]+" : "+ar(r.from)+(r.to>r.from?" – "+ar(r.to):"")}
function link(r){return "https://quran.com/"+r.s+":"+r.from}
function rhtml(r){return '<div class="rng"><b>'+rtxt(r)+'</b><a href="'+link(r)+'" target="_blank" rel="noopener">افتح المصحف ↗</a></div>'}
function streak(){
  var d=new Date(),c=0;
  if(!S.hist[dk(d)])d.setDate(d.getDate()-1);
  while(S.hist[dk(d)]){c++;d.setDate(d.getDate()-1)}
  return c;
}
function total(){return flat().length}
function done(rate){
  var today=dk(),wasDone=S.hist[today];if(wasDone)return;
  var p=portion(),tot=total(),n=0;
  p.forEach(function(r){n+=cnt(r)});
  var oldWeak=S.weak;S.weak=[];
  if(rate==="w"){p.forEach(function(r){S.weak.push(r)})}
  S.hist[today]={r:rate,n:n+oldWeak.reduce(function(a,r){return a+cnt(r)},0)};
  p.forEach(function(r){bump(r.s,rate==="g"?1:rate==="w"?-1:0)});
  if(S.ptr+Math.min(S.per,tot)>=tot)S.cyc=(S.cyc||0)+1;
  S.ptr=(S.ptr+Math.min(S.per,tot))%tot;
  save();render();
}
function undo(){
  var t=dk(),h=S.hist[t];if(!h)return;
  var tot=total();delete S.hist[t];
  if(S.ptr-Math.min(S.per,tot)<0&&S.cyc>0)S.cyc--;
  S.ptr=(S.ptr-Math.min(S.per,tot)+tot)%tot;
  save();render();
}
function vToday(){
  var el="",tot=total(),t=dk(),h=S.hist[t];
  var hd=new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
  el+='<h1>وِردي اليومي</h1><div class="sub">'+hd+'</div>';
  el+='<div class="card"><div class="stats"><div class="stat"><b>'+ar(streak())+'</b><span>أيام متتالية 🔥</span></div><div class="stat"><b>'+ar(Object.keys(S.hist).length)+'</b><span>أيام الورد</span></div><div class="stat"><b>'+ar(S.per)+'</b><span>آية يوميًا</span></div></div></div>';
  if(!tot){
    el+='<div class="card"><h2>ابدأ من هنا</h2><p>اختر السور التي حفظتها من تبويب «محفوظاتي» وسأرتّب لك ورد المراجعة اليومي تلقائيًا.</p><button data-go="mem">اختيار المحفوظات</button></div>';
    return el;
  }
  if(S.weak.length&&!h){
    el+='<div class="card" style="border-color:var(--bad)"><h2>🔁 تثبيت: مواضع ضعيفة من الأمس</h2>';
    S.weak.forEach(function(r){el+=rhtml(r)});el+='</div>';
  }
  var p=portion();
  el+='<div class="card"><h2>📖 وردك اليوم</h2><div class="sub">'+ar(Math.min(S.per,tot))+' آية من محفوظاتك</div>';
  p.forEach(function(r){el+=rhtml(r)});
  if(T)el+='<button class="ghost sm" data-wt="1" style="margin-top:8px">'+['📖 عرض نص الورد (مخفي للتسميع)','👁 إظهار الكل','إغلاق النص'][S.wt||0]+'</button>'+(S.wt?wirdText(p):'');
  if(h){
    var lbl={g:"ممتاز",m:"جيد",w:"يحتاج تثبيت"}[h.r];
    el+='<div class="ok">✅ أتممت ورد اليوم — التقييم: '+lbl+'</div><div style="text-align:center"><button class="ghost sm" data-undo="1">تراجع</button></div>';
  }else{
    el+='<div class="sub" style="margin-top:10px">راجع الورد من حفظك دون النظر، ثم قيّم نفسك بصدق:</div><div class="rate"><button class="g" data-rate="g">ممتاز</button><button class="m" data-rate="m">جيد</button><button class="w" data-rate="w">ضعيف</button></div>';
  }
  el+='</div>';
  return el;
}
var E={phase:"setup",scope:"all",n:10,mode:"mix",auto:true,qs:[],i:0,score:0,miss:[],fb:null,t0:0,spoken:-1},TM=null;
function val(id){return document.getElementById(id).value}
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";speechSynthesis.speak(u)}catch(e){}}
function rnd(n){return Math.floor(Math.random()*n)}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function scopeList(){
  var o=[];
  if(E.scope==="today"){portion().forEach(function(r){for(var a=r.from;a<=r.to;a++)o.push(r.s*1000+a)});return o}
  if(E.scope==="hard")return(S.hard||[]).slice();
  if(E.scope==="weak"){var f3=flat(),st={},ids=[];f3.forEach(function(v){var s=Math.floor(v/1000);if(!st[s]){st[s]=1;ids.push(s)}});ids.sort(function(a,b){return((S.str||{})[a]||0)-((S.str||{})[b]||0)});var keep={};ids.slice(0,5).forEach(function(s){keep[s]=1});return f3.filter(function(v){return keep[Math.floor(v/1000)]})}
  if(E.scope==="new"){(S.nlog||[]).slice(-5).forEach(function(r){for(var a=r.from;a<=r.to;a++)o.push(r.s*1000+a)});return o}
  var f=flat();
  if(E.scope.charAt(0)==="s"){var sn=+E.scope.slice(1);return f.filter(function(v){return Math.floor(v/1000)===sn})}
  return f;
}
var LS=0;
function mkQ(kind,L,set){var q=mkQ0(kind,L,set);q.s=LS;return q}
function mkQ0(kind,L,set){
  var v=L[rnd(L.length)],s=Math.floor(v/1000),a=v%1000;LS=s;
  if(kind==="next"&&!set[v+1])kind="rec";
  if(kind==="rec"){var b=a,len=3+rnd(5);while(b-a<len-1&&set[s*1000+b+1])b++;
    var t="سمّع من سورة "+N[s-1]+" من الآية "+ar(a)+" إلى الآية "+ar(b);
    return{t:"o",txt:t,say:t,r:{s:s,from:a,to:b}}}
  if(kind==="next"){var t2="اقرأ الآية التي تلي الآية "+ar(a)+" من سورة "+N[s-1]+" وأكمل ثلاث آيات";
    return{t:"o",txt:t2,say:t2,r:{s:s,from:a+1,to:Math.min(a+3,C[s-1])}}}
  if(kind==="cnt"){var c=C[s-1],o=[c];while(o.length<4){var x=c+rnd(11)-5;if(x>0&&o.indexOf(x)<0)o.push(x)}
    o=shuf(o);var q="كم عدد آيات سورة "+N[s-1]+"؟";
    return{t:"m",txt:q,say:q,opts:o.map(ar),ans:o.indexOf(c)}}
  if(kind==="num"){var o4=numOpts(s,114),qn="ما رقم سورة "+N[s-1]+" في ترتيب المصحف؟";return{t:"m",txt:qn,say:qn,opts:o4.map(ar),ans:o4.indexOf(s)}}
  if(kind==="nth"){var qh="ما اسم السورة رقم "+ar(s)+"؟",o5=[N[s-1]];while(o5.length<4){var z=N[rnd(114)];if(o5.indexOf(z)<0)o5.push(z)}o5=shuf(o5);return{t:"m",txt:qh,say:qh,opts:o5,ans:o5.indexOf(N[s-1])}}
  if(kind==="prev"){if(s===1)s=2;LS=s;var qp="ما السورة التي تأتي قبل سورة "+N[s-1]+" في المصحف؟",o6=[N[s-2]];while(o6.length<4){var z2=N[rnd(114)];if(o6.indexOf(z2)<0&&z2!==N[s-1])o6.push(z2)}o6=shuf(o6);return{t:"m",txt:qp,say:qp,opts:o6,ans:o6.indexOf(N[s-2])}}
  if(kind==="juz"){var ix=ALL.indexOf(s*1000+1),jz=1;for(var k=0;k<30;k++)if(JS[k]<=ix)jz=k+1;var qj="في أي جزء تبدأ سورة "+N[s-1]+"؟",o7=numOpts(jz,30);return{t:"m",txt:qj,say:qj,opts:o7.map(ar),ans:o7.indexOf(jz)}}
  if(kind==="long"){var ss=[s],used={};used[C[s-1]]=1;while(ss.length<4){var y2=1+rnd(114);if(!used[C[y2-1]]){used[C[y2-1]]=1;ss.push(y2)}}ss=shuf(ss);var mx=0;ss.forEach(function(x,i){if(C[x-1]>C[ss[mx]-1])mx=i});var ql="أي هذه السور أكثر عددًا في الآيات؟";return{t:"m",txt:ql,say:ql,opts:ss.map(function(x){return N[x-1]}),ans:mx}}
  if(s===114)s=113;
  var q2="ما السورة التي تأتي بعد سورة "+N[s-1]+" في المصحف؟",o3=[N[s]];
  while(o3.length<4){var y=N[rnd(114)];if(o3.indexOf(y)<0&&y!==N[s-1])o3.push(y)}
  o3=shuf(o3);return{t:"m",txt:q2,say:q2,opts:o3,ans:o3.indexOf(N[s])}
}
function xnext(){E.fb=null;E.i++;if(E.i>=E.n)xfinish();else{E.t0=Date.now();render()}}
function xfinish(){
  E.phase="done";var seen={};
  E.miss.forEach(function(r){var k=r.s+":"+r.from;if(!seen[k]){seen[k]=1;S.weak.push(r)}});
  S.weak=S.weak.slice(-8);
  S.exams=(S.exams||[]).concat([{d:dk(),sc:E.score,n:E.n}]).slice(-20);
  try{speechSynthesis.cancel()}catch(e){}
  save();render();
}
function vExam(){
  var el='<h1>الاختبار الشفوي</h1>';
  if(E.phase==="setup"){
    el+='<div class="sub">أنا المُمتحِن: أسألك بصوتي، وتجيب بصوتك من حفظك، ثم تقيّم نفسك بصدق</div>';
    if(!total())return el+'<div class="card"><p>اختر محفوظاتك أولًا.</p><button data-go="mem">اختيار المحفوظات</button></div>';
    el+='<div class="card"><label class="sub">نطاق الاختبار</label><select id="xs"><option value="all">كل المحفوظ</option><option value="today">ورد اليوم</option><option value="hard">الآيات الصعبة ★</option><option value="weak">الأضعف حفظًا (٥ سور)</option><option value="new">آخر حفظ جديد</option>';
    var seen={};flat().forEach(function(v){var s=Math.floor(v/1000);if(!seen[s]){seen[s]=1;el+='<option value="s'+s+'">سورة '+N[s-1]+'</option>'}});
    el+='</select><label class="sub" style="display:block;margin-top:10px">نوع الأسئلة</label><select id="xm"><option value="mix">اختيار من متعدد (كل الأنواع)</option><option value="mixold" style="display:none">مختلط</option><option value="oral">تسميع فقط</option><option value="know">أسئلة معرفة (عدد الآيات والترتيب)</option></select><label class="sub" style="display:block;margin-top:10px">عدد الأسئلة</label><select id="xn"><option value="5">٥</option><option value="10">١٠</option><option value="15">١٥</option><option value="20">٢٠</option></select><label style="display:block;margin-top:10px"><input id="xa" type="checkbox" style="width:auto"> قراءة السؤال بصوت عالٍ</label><button data-xstart="1" style="margin-top:12px;width:100%">ابدأ الاختبار</button><div id="xmsg" class="sub" style="color:var(--bad)"></div>'+(T?'':'<div class="sub">💡 لتفعيل أسئلة «أكمل الآية» و«ما الآية التالية» استورد نص المصحف من تبويب «المصحف».</div>')+'</div>';
    var hx=(S.exams||[]).slice(-5).reverse();
    if(hx.length){el+='<div class="card"><h2>آخر اختباراتك</h2>';hx.forEach(function(x){el+='<div class="sub">• '+x.d+' — '+ar(x.sc)+' من '+ar(x.n)+' ('+ar(Math.round(x.sc/x.n*100))+'٪)</div>'});el+='</div>'}
    return el;

  [5,10,15,20,30,40,50,75,100].forEach(function(v){el+='<option value="'+v+'"'+(S.per===v?' selected':'')+'>'+ar(v)+' آية</option>'});
  el+='</select><label class="sub" style="display:block;margin-top:10px">ترتيب المراجعة</label><select id="ord"><option value="asc"'+(S.order==="asc"?' selected':'')+'>من الفاتحة إلى الناس</option><option value="desc"'+(S.order==="desc"?' selected':'')+'>من الناس إلى الفاتحة</option></select>';
  el+='<p class="sub">ملاحظة: كل حوالي ٢٠ آية تقريبًا = صفحة واحدة من المصحف.</p></div>';
  el+='<div class="card"><button class="ghost sm" data-reset="1">مسح كل البيانات</button></div>';
  return el;
}
function vProg(){
  var tot=total(),el='<h1>تقدّمي</h1>';
  var days=Object.keys(S.hist).length,ay=0,g=0;
  Object.keys(S.hist).forEach(function(k){ay+=S.hist[k].n||0;if(S.hist[k].r==="g")g++});
  var cyc=tot?Math.round(S.ptr/tot*100):0;
  el+='<div class="card"><h2>دورة المراجعة الحالية</h2><div class="bar"><i style="width:'+cyc+'%"></i></div><div class="sub" style="margin-top:6px">'+ar(cyc)+'٪ — الآية '+ar(S.ptr)+' من '+ar(tot)+'</div>';
  el+='<div class="sub">دورات مكتملة: '+ar(S.cyc||0)+'</div>';
  if(tot&&S.per)el+='<div class="sub">تكتمل الدورة بعد نحو '+ar(Math.ceil((tot-S.ptr)/S.per))+' يوم</div>';
  el+='</div>';
  el+='<div class="card"><div class="stats"><div class="stat"><b>'+ar(streak())+'</b><span>سلسلة حالية</span></div><div class="stat"><b>'+ar(days)+'</b><span>أيام الورد</span></div><div class="stat"><b>'+ar(ay)+'</b><span>آيات روجعت</span></div></div></div>';
  el+='<div class="card"><h2>آخر ٣٥ يومًا</h2><div class="grid">';
  var d=new Date();d.setDate(d.getDate()-34);
  for(var i=0;i<35;i++){var k=dk(d),h=S.hist[k];
    el+='<div class="day '+(h?h.r:'')+(k===dk()?' t':'')+'">'+ar(d.getDate())+'</div>';d.setDate(d.getDate()+1)}
  el+='</div><div class="sub" style="margin-top:8px">🟩 ممتاز &nbsp; 🟨 جيد &nbsp; 🟥 ضعيف</div></div>';
  el+='<div class="card"><h2>نسخة احتياطية</h2><div class="sub">بياناتك محفوظة في هذا المتصفح. صدّرها وخزّن النص، أو الصق نسخة قديمة ثم استورد</div><textarea id="bk" rows="3" style="width:100%;font-size:.75rem;direction:ltr;margin-top:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px"></textarea><div class="row" style="margin-top:8px"><button class="ghost sm" data-bk="out">تصدير</button><button class="ghost sm" data-bk="in">استيراد</button></div><div id="bmsg" class="sub" style="color:var(--bad)"></div></div>';
  return el;
}
function render(){
  var a=document.getElementById("app");
  a.innerHTML=S.tab==="today"?vToday()+vExtra():S.tab==="mem"?vMem():S.tab==="exam"?vExam():S.tab==="read"?vRead():vProg()+strCard();
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===S.tab)});
  clearInterval(TM);
  if(S.tab==="read"){var rs=document.getElementById("rs");if(rs){rs.value=R.s;document.getElementById("rh").checked=R.hide}}
  if(S.tab==="exam"){
    var xs=document.getElementById("xs");
    if(xs){xs.value=E.scope;document.getElementById("xn").value=E.n;document.getElementById("xm").value=E.mode;document.getElementById("xa").checked=E.auto}
    if(E.phase==="run"){
      TM=setInterval(function(){var t=document.getElementById("tm");if(t)t.textContent=ar(Math.floor((Date.now()-E.t0)/1000))+" ث"},1000);
      if(E.auto&&!E.fb&&E.spoken!==E.i){E.spoken=E.i;say(E.qs[E.i].say)}
    }
  }
}
function go(t){S.tab=t;save();render();window.scrollTo(0,0)}
function setMem(a){S.mem=a;S.ptr=0;S.weak=[];save();render()}
document.querySelector("nav").addEventListener("click",function(e){var t=e.target.dataset.t;if(t)go(t)});
document.getElementById("app").addEventListener("click",function(e){
  var d=e.target.dataset;
  if(d.go)go(d.go);
  if(d.rate)done(d.rate);
  if(d.undo)undo();
  if(d.xstart){E.scope=val("xs");E.n=+val("xn");E.mode=val("xm");E.auto=document.getElementById("xa").checked;
    var XL=scopeList();if(!XL.length){document.getElementById("xmsg").textContent="لا توجد آيات في هذا النطاق";return}
    var xset={};XL.forEach(function(v){xset[v]=1});if(E.scope==="hard")XL.forEach(function(v){xset[v+1]=1;xset[v-1]=1});E.qs=[];
    for(var xq=0;xq<E.n;xq++){var kd=E.mode==="oral"?(xq%2?"next":"rec"):E.mode==="know"?(xq%2?"ord":"cnt"):(Math.random()<0.65?(Math.random()<0.5?"rec":"next"):(Math.random()<0.5?"cnt":"ord"));E.qs.push(pickQ(xq,XL,xset))}
    E.phase="run";E.i=0;E.score=0;E.miss=[];E.fb=null;E.t0=Date.now();E.spoken=-1;render()}
  if(d.say)say(E.qs[E.i].say);
  if(d.g!==undefined){var sc=+d.g;E.score+=sc;if(E.qs[E.i].s)bump(E.qs[E.i].s,sc===1?1:sc===0?-1:0);if(sc<1)E.miss.push(E.qs[E.i].r);xnext()}
  if(d.pick!==undefined&&!E.fb){var qq=E.qs[E.i],pk=+d.pick;E.fb={pick:pk};if(pk===qq.ans)E.score++;if(qq.s)bump(qq.s,pk===qq.ans?1:-1);render()}
  if(d.xnext)xnext();
  if(d.xend){var an=E.i+(E.fb?1:0);if(!an){E.phase="setup";render()}else{E.n=an;xfinish()}}
  if(d.xnew){E.phase="setup";render()}
  if(e.target.classList&&e.target.classList.contains("hid"))e.target.classList.toggle("show");
  if(d.rn){R.s=Math.min(114,Math.max(1,R.s+(+d.rn)));S.rd=R.s;render();window.scrollTo(0,0)}
  if(d.rm){var ri=S.mem.indexOf(R.s);if(ri>-1)S.mem.splice(ri,1);else S.mem.push(R.s);S.ptr=0;S.weak=[];save();render()}
  if(d.timp)impT(document.getElementById("ft").value);
  if(d.wt){S.wt=((S.wt||0)+1)%3;save();render()}
  if(d.plt){S.pt=!S.pt;save();render()}
  if(d.plstart){var ps2=+val("pls"),pa2=+val("pla"),pm2=document.getElementById("plmsg");
    if(!pa2||pa2<1||pa2>C[ps2-1]){pm2.textContent="رقم الآية غير صحيح — السورة فيها "+ar(C[ps2-1])+" آية";return}
    S.plan={s:ps2,a:pa2,per:+val("plp"),dir:val("pld")};S.pp=0;S.nh=S.nh||{};save();render()}
  if(d.pldo){var L2=planList(),pp2=S.pp||0,nn=Math.max(1,Math.min(+document.getElementById("pln").value||1,L2.length-pp2)),rg=ranges(L2.slice(pp2,pp2+nn)).map(function(r){return{s:r.s,from:r.from,to:r.to}});
    rg.forEach(function(r){S.parts.push(r);S.nlog=(S.nlog||[]).concat([{s:r.s,from:r.from,to:r.to,d:dk()}]).slice(-60)});
    S.nh=S.nh||{};S.nh[dk()]=(S.nh[dk()]||0)+nn;S.pp=pp2+nn;S.plast={d:dk(),n:nn,r:rg};save();render()}
  if(d.plundo&&S.plast){var pl=S.plast,k2=pl.r.length;
    if(JSON.stringify(S.parts.slice(-k2))===JSON.stringify(pl.r)){S.parts.splice(-k2,k2);S.nlog.splice(-k2,k2)}
    S.nh[pl.d]=Math.max(0,(S.nh[pl.d]||0)-pl.n);S.pp=Math.max(0,(S.pp||0)-pl.n);S.plast=null;save();render()}
  if(d.plreset){if(e.target.dataset.arm){S.plan=null;S.pp=0;S.plast=null;save();render()}else{e.target.dataset.arm="1";e.target.textContent="اضغط مرة أخرى للتأكيد"}}
  if(d.hv){var hv=+d.hv,hl=(S.hard=S.hard||[]),hi=hl.indexOf(hv);if(hi>-1)hl.splice(hi,1);else hl.push(hv);e.target.textContent=hi>-1?"☆":"★";save()}
  if(d.sq){R.q=document.getElementById("sq").value;render()}
  if(d.gv){var gv=+d.gv;R.s=Math.floor(gv/1000);S.rd=R.s;R.q="";save();render();var ge=document.getElementById("ay"+gv);if(ge)ge.scrollIntoView({block:"center"})}
  if(d.fz){S.fs=Math.min(2,Math.max(1,(S.fs||1.3)+0.15*(+d.fz)));document.documentElement.style.setProperty("--fz",S.fs+"rem");save()}
  if(d.j){var j=+d.j,k=S.juz.indexOf(j);if(k>-1)S.juz.splice(k,1);else S.juz.push(j);S.ptr=0;S.weak=[];save();render()}
  if(d.padd){var ps=+document.getElementById("ps").value,pf=+document.getElementById("pf").value,pt=+document.getElementById("pt").value||pf,pm=document.getElementById("pmsg");
    if(!pf||pt<pf||pt>C[ps-1]){pm.textContent="تأكد من الأرقام — السورة فيها "+ar(C[ps-1])+" آية";return}
    S.parts.push({s:ps,from:pf,to:pt});S.ptr=0;S.weak=[];save();render()}
  if(d.pdel!==undefined){S.parts.splice(+d.pdel,1);S.ptr=0;S.weak=[];save();render()}
  if(d.nlog){var ns=+document.getElementById("ns").value,nf=+document.getElementById("nf").value,nt=+document.getElementById("nt").value||nf,nm=document.getElementById("nmsg");
    if(!nf||nt<nf||nt>C[ns-1]){nm.textContent="تأكد من الأرقام — السورة فيها "+ar(C[ns-1])+" آية";return}
    S.parts.push({s:ns,from:nf,to:nt});S.nlog=(S.nlog||[]).concat([{s:ns,from:nf,to:nt,d:dk()}]);save();render()}
  if(d.quiz){var f=flat(),v=f[Math.floor(Math.random()*f.length)],qs=Math.floor(v/1000),qa=v%1000;
    document.getElementById("qz").innerHTML='<div class="rng"><b>اقرأ ٣ آيات بدءًا من سورة '+N[qs-1]+' آية '+ar(qa)+'</b><a href="https://quran.com/'+qs+':'+qa+'" target="_blank" rel="noopener">تحقق ↗</a></div><div class="rate" style="grid-template-columns:1fr 1fr"><button class="g" data-qa="1">قرأتها صح ✅</button><button class="w" data-qa="0">أخطأت</button></div>'}
  if(d.qa!==undefined){S.quiz.n++;if(d.qa==="1")S.quiz.ok++;save();render()}
  if(d.bk==="out"){document.getElementById("bk").value=JSON.stringify(S)}
  if(d.bk==="in"){try{var o=JSON.parse(document.getElementById("bk").value);S=Object.assign(fresh(),o);S.tab="prog";save();render()}catch(x){document.getElementById("bmsg").textContent="النص غير صالح"}}
  if(d.s){var id=+d.s,i=S.mem.indexOf(id);if(i>-1)S.mem.splice(i,1);else S.mem.push(id);S.ptr=0;S.weak=[];save();
    var q=document.getElementById("q").value;render();var nq=document.getElementById("q");nq.value=q;filter(q)}
  if(d.q){var r=[],i;
    if(d.q==="amma")for(i=78;i<=114;i++)r.push(i);
    if(d.q==="tab"){for(i=67;i<=114;i++)r.push(i)}
    if(d.q==="all")for(i=1;i<=114;i++)r.push(i);
    setMem(r)}
  if(d.reset){if(e.target.dataset.arm){S=fresh();save();render()}else{e.target.dataset.arm="1";e.target.textContent="اضغط مرة أخرى لتأكيد المسح"}}
});
function filter(v){document.querySelectorAll("#chips .chip").forEach(function(c){c.style.display=N[+c.dataset.s-1].indexOf(v)>-1?"":"none"})}
document.getElementById("app").addEventListener("input",function(e){
  if(e.target.id==="q")filter(e.target.value.trim());
});
document.getElementById("app").addEventListener("change",function(e){
  if(e.target.id==="per"){S.per=+e.target.value;save()}
  if(e.target.id==="rs"){R.s=+e.target.value;S.rd=R.s;save();render()}
  if(e.target.id==="plper"&&S.plan){S.plan.per=+e.target.value;save();render()}
  if(e.target.id==="rh"){R.hide=e.target.checked;render()}
  if(e.target.id==="fi"&&e.target.files[0]){var fr=new FileReader();fr.onload=function(){impT(fr.result)};fr.readAsText(e.target.files[0])}
  if(e.target.id==="ord"){S.order=e.target.value;S.ptr=0;save()}
});
render();
var TB=false;
document.documentElement.style.setProperty("--fz",(S.fs||1.3)+"rem");
(function(){
  if(T)return;
  try{
    import("https://cdn.jsdelivr.net/npm/@muslims-community/quran@1.0.0/+esm").then(function(m){
      var g=m.getAyah||(m.default&&m.default.getAyah);
      if(!g)return;
      var o={},n=0;
      for(var s=1;s<=114;s++)for(var a=1;a<=C[s-1];a++){
        var r=g(s,a),t=r&&(r.text||r.arabic);
        if(t){if(a===1&&s!==1&&s!==9){var w=t.split(" ");if(w.length>4&&nz(w.slice(0,4).join(" "))==="بسم الله الرحمن الرحيم")t=w.slice(4).join(" ")}o[s*1000+a]=t;n++}}
      if(n>=6200){T=o;TB=true;render()}
    }).catch(function(){});
  }catch(e){}
})();
</script>
</body>
</html>
